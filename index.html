<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Daily Wellness</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root {
      --bg: #faf8f4;
      --fg: #1d1d1f;
      --muted: #6b6b70;
      --line: #e5e3dd;
      --sage: #8aa68a;
      --amber: #c8954b;
      --sky:  #6a8caf;
      --slate: #6b7785;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 96px; }
    header { padding: 12px 0 8px; }
    header h1 { font-size: 20px; margin: 0 0 2px; font-weight: 600; }
    header .stat { color: var(--muted); font-size: 14px; }
    .save-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px;
      background: var(--bg); border-top: 1px solid var(--line);
      display: flex; gap: 12px; justify-content: space-between; align-items: center; }
    .save-bar button { padding: 12px 18px; border-radius: 10px; border: 0;
      background: var(--fg); color: white; font-size: 16px; font-weight: 600; }
    .save-bar a { color: var(--muted); font-size: 14px; text-decoration: none; }
    .save-bar a + a { margin-left: 12px; }
    section.section { margin: 18px 0; padding: 12px 14px; border-radius: 12px;
      background: white; border: 1px solid var(--line); }
    section.section h2 { font-size: 15px; font-weight: 600; margin: 0 0 8px;
      letter-spacing: 0.01em; }
    section.section[data-key="nutrition"]   h2 { color: var(--sage); }
    section.section[data-key="supplements"] h2 { color: var(--amber); }
    section.section[data-key="activity"]    h2 { color: var(--sky); }
    section.section[data-key="structural"]  h2 { color: var(--slate); }

    .row { display: flex; align-items: flex-start; gap: 10px; padding: 10px 4px;
      border-top: 1px solid var(--line); cursor: pointer; }
    .row:first-of-type { border-top: 0; }
    .row input[type="checkbox"] { width: 22px; height: 22px; margin-top: 1px; }
    .row .label { flex: 1; }
    .row .label small { display: block; color: var(--muted); font-size: 13px; }
    .row .note-toggle { display: inline-block; margin-top: 4px; color: var(--muted);
      font-size: 13px; text-decoration: underline; cursor: pointer; }
    .row textarea { display: block; width: 100%; margin-top: 6px; padding: 8px;
      border: 1px solid var(--line); border-radius: 8px; font: inherit;
      resize: vertical; min-height: 36px; }
    .row[data-checked="true"] .note-toggle, .row[data-checked="true"] textarea { display: none; }
    .settings .sec-block { margin: 18px 0; padding: 12px 14px; border-radius: 12px;
      background: white; border: 1px solid var(--line); }
    .settings .sec-block h3 { margin: 0 0 8px; font-size: 15px; }
    .settings .item { display: flex; gap: 8px; align-items: center; padding: 6px 0;
      border-top: 1px solid var(--line); }
    .settings .item:first-of-type { border-top: 0; }
    .settings .item input[type="text"] { flex: 1; padding: 8px; font: inherit;
      border: 1px solid var(--line); border-radius: 8px; }
    .settings .item button { padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: white; }
    .settings .add { margin-top: 8px; }
    .settings .reset { margin-top: 18px; color: var(--muted); }
    .settings a.back { color: var(--muted); text-decoration: none; }
    .history h3 { font-size: 15px; margin: 16px 0 6px; }
    .history .day { padding: 12px 14px; background: white; border: 1px solid var(--line);
      border-radius: 12px; margin-bottom: 12px; }
    .history .day .summary { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
    .history .day ul { margin: 0; padding-left: 18px; }
    .history .day li.miss { color: var(--muted); }
    .history .day li .why { color: var(--muted); font-size: 13px; }
    .settings .reorder-link { display: inline-block; margin-bottom: 12px; padding: 10px 14px;
      background: white; border: 1px solid var(--line); border-radius: 10px;
      color: var(--fg); text-decoration: none; font-weight: 500; }
    .reorder { background: white; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; margin-top: 12px; }
    .reorder .ord { display: flex; gap: 8px; align-items: center; padding: 8px 0;
      border-top: 1px solid var(--line); }
    .reorder .ord:first-of-type { border-top: 0; }
    .reorder .ord button { padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: white; }
    .reorder .ord .num { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .reorder .ord .label { flex: 1; }
    .empty-page { color: var(--muted); padding: 24px 4px; font-size: 14px; }
    section.ordered { margin: 18px 0; padding: 12px 14px; border-radius: 12px;
      background: white; border: 1px solid var(--line); }
    section.ordered .row .num { width: 28px; color: var(--muted);
      font-variant-numeric: tabular-nums; flex: 0 0 auto; }

    .settings .flat-list { background: white; border: 1px solid var(--line); border-radius: 12px;
      padding: 8px 12px; margin-top: 6px; }
    .settings .flat-list .item { display: flex; gap: 8px; align-items: center; padding: 8px 0;
      border-top: 1px solid var(--line); flex-wrap: wrap; }
    .settings .flat-list .item:first-of-type { border-top: 0; }
    .settings .flat-list .num { width: 28px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .settings .flat-list .item input[type="text"] { flex: 1; min-width: 120px; padding: 8px; font: inherit;
      border: 1px solid var(--line); border-radius: 8px; }
    .settings .flat-list .item button { padding: 6px 10px; border-radius: 8px;
      border: 1px solid var(--line); background: white; }
    .settings .flat-list .macros-chip { padding: 4px 8px; border-radius: 999px; font-size: 12px;
      border: 1px solid var(--line); background: white; color: var(--muted); cursor: pointer; }
    .settings .flat-list .macros-chip.on { background: var(--fg); color: white; border-color: var(--fg); }

    /* hero card */
    .hero { background: linear-gradient(180deg, #ffffff 0%, #f8f6f1 100%);
      border: 1px solid var(--line); border-radius: 18px;
      padding: 18px 18px 14px; margin: 10px 0 18px;
      box-shadow: 0 6px 20px rgba(45, 55, 65, .08), 0 2px 4px rgba(45, 55, 65, .04); }
    .hero .section-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--muted); font-weight: 600; margin-bottom: 8px; }
    .hero .hero-row { display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-top: 1px solid var(--line); flex-wrap: wrap; }
    .hero .hero-row:first-of-type { border-top: 0; padding-top: 4px; }
    .hero .hero-row .glyph { width: 22px; flex: 0 0 auto; color: var(--muted); font-size: 16px; }
    .hero .hero-row .label { color: var(--fg); font-size: 14px; min-width: 56px; }
    .hero .hero-row .value { font-variant-numeric: tabular-nums; color: var(--fg); font-size: 14px; }
    .hero .hero-row .target { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
    .hero .hero-row .sub { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .hero .hero-row input[type="number"] { width: 72px; padding: 6px 8px;
      border: 1px solid var(--line); border-radius: 8px; font: inherit; font-variant-numeric: tabular-nums; }
    .hero .hero-row .grow { flex: 1; min-width: 0; }
    .hero .hero-row button { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: white; cursor: pointer; font: inherit; transition: transform 100ms ease; }
    .hero .hero-row button:active { transform: scale(.98); }
    .hero .hero-row button.primary { background: var(--fg); color: white; border-color: var(--fg); }
    .hero .hero-row a.undo { font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }

    /* progress bar */
    .bar { display: inline-block; height: 6px; flex: 1 1 80px; min-width: 60px; max-width: 180px;
      background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: var(--sage);
      border-radius: 999px; transition: width 200ms ease; }
    .bar.over > span { background: var(--amber); }

    /* fasting ring */
    .fast-block { display: flex; align-items: center; gap: 18px;
      padding: 18px; border-radius: 16px;
      background: linear-gradient(135deg, #f0f7f0 0%, #e8f1e6 100%);
      border: 1px solid rgba(138, 166, 138, 0.25);
      margin-bottom: 14px; }
    .fast-ring { position: relative; width: 140px; height: 140px; flex: 0 0 auto;
      filter: drop-shadow(0 4px 8px rgba(138, 166, 138, 0.25)); }
    .fast-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .fast-ring .track { fill: none; stroke: rgba(138,166,138,0.18); stroke-width: 11; }
    .fast-ring .progress { fill: none; stroke: url(#fast-gradient); stroke-width: 11;
      stroke-linecap: round; transition: stroke-dashoffset 400ms ease; }
    .fast-ring .center { position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .fast-ring .center .icon { font-size: 22px; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08)); }
    .fast-ring .center .stage { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
      color: #4a6a4a; font-weight: 700; }
    .fast-block .fast-info { flex: 1; min-width: 0; }
    .fast-block .fast-time { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: #2d3d2d; line-height: 1; letter-spacing: -0.02em; }
    .fast-block .fast-time-label { font-size: 12px; color: #5a7a5a; margin-top: 4px; font-weight: 500; }
    .fast-block .fast-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
    .fast-block .fast-actions button { padding: 9px 18px; border-radius: 999px; border: 0;
      background: linear-gradient(135deg, #8aa68a 0%, #6b8b6b 100%);
      color: white; font: inherit; font-weight: 600; cursor: pointer;
      box-shadow: 0 2px 6px rgba(107, 139, 107, 0.35);
      transition: transform 100ms ease, box-shadow 150ms ease; }
    .fast-block .fast-actions button:active { transform: scale(.97); box-shadow: 0 1px 3px rgba(107, 139, 107, 0.3); }
    .fast-block .fast-actions button.ghost { background: white; color: #4a6a4a;
      border: 1px solid rgba(138, 166, 138, 0.4); font-weight: 500; padding: 7px 14px;
      box-shadow: none; }
    .fast-block .fast-actions input[type="datetime-local"] { padding: 7px 10px;
      border: 1px solid rgba(138, 166, 138, 0.4); border-radius: 8px;
      background: white; font: inherit; flex: 1 1 200px; min-width: 0; }
    .fast-block .fast-actions select { padding: 7px 12px;
      border: 1px solid rgba(138, 166, 138, 0.4); border-radius: 999px;
      font: inherit; background: white; color: #4a6a4a; font-weight: 500; }
    .fast-block .stage-detail { font-size: 12px; color: #5a7a5a; margin-top: 8px;
      line-height: 1.45; font-style: italic; }

    /* water glass */
    .water-block { display: flex; align-items: center; gap: 18px;
      padding: 18px; border-radius: 16px;
      background: linear-gradient(135deg, #eaf2f8 0%, #dde9f2 100%);
      border: 1px solid rgba(106, 140, 175, 0.25);
      margin-bottom: 14px; }
    .water-glass { position: relative; width: 70px; height: 100px; flex: 0 0 auto;
      filter: drop-shadow(0 4px 8px rgba(106, 140, 175, 0.25)); }
    .water-glass .outline { position: absolute; inset: 0;
      border: 2.5px solid rgba(106, 140, 175, 0.5); border-top: 0;
      border-radius: 0 0 16px 16px; overflow: hidden;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(2px); }
    .water-glass .water-fill { position: absolute; left: 0; right: 0; bottom: 0;
      background: linear-gradient(180deg, rgba(106, 140, 175, 0.65) 0%, rgba(74, 108, 145, 0.95) 100%);
      transition: height 500ms cubic-bezier(.4, 0, .2, 1);
      border-radius: 0 0 13px 13px; }
    .water-glass .water-fill::before {
      content: ''; position: absolute; top: -4px; left: -2px; right: -2px; height: 8px;
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(106, 140, 175, 0.85) 100%);
      border-radius: 50%;
      animation: water-wave 3s ease-in-out infinite;
    }
    @keyframes water-wave { 0%,100% { transform: translateX(-3px) scaleY(0.85); } 50% { transform: translateX(3px) scaleY(1.15); } }
    .water-block .water-info { flex: 1; min-width: 0; }
    .water-block .water-value { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums;
      color: #2c4a6a; line-height: 1; letter-spacing: -0.02em; }
    .water-block .water-target { font-size: 12px; color: #4a6c8c; margin-top: 4px; font-weight: 500; }
    .water-block .water-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
    .water-block .water-actions button { padding: 7px 16px; border-radius: 999px;
      border: 1.5px solid rgba(106, 140, 175, 0.5);
      background: white; color: #4a6c8c;
      font: inherit; font-weight: 600; cursor: pointer;
      transition: transform 100ms ease, background 150ms ease;
      box-shadow: 0 1px 3px rgba(106, 140, 175, 0.15); }
    .water-block .water-actions button:active { transform: scale(.96); background: rgba(106, 140, 175, 0.1); }
    .water-block .water-actions a.undo { font-size: 12px; color: #6a8caf;
      text-decoration: underline; cursor: pointer; }

    /* steps row (compact, peach gradient) */
    .steps-block { display: flex; align-items: center; gap: 12px;
      padding: 14px 18px; border-radius: 14px;
      background: linear-gradient(135deg, #fcefe0 0%, #f5e1cc 100%);
      border: 1px solid rgba(200, 149, 75, 0.25);
      margin-bottom: 14px; flex-wrap: wrap; }
    .steps-block .glyph { font-size: 22px; }
    .steps-block .label { font-size: 14px; min-width: 50px; color: #6e4f2a; font-weight: 600; }
    .steps-block input[type="number"] { width: 90px; padding: 7px 10px;
      border: 1px solid rgba(200, 149, 75, 0.4); border-radius: 8px;
      background: white; font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; color: #6e4f2a; }
    .steps-block .target { color: #8a6840; font-size: 13px; font-weight: 500; }
    .steps-block .bar { flex: 1 1 80px; min-width: 60px; max-width: none; height: 8px;
      background: rgba(200, 149, 75, 0.18); border-radius: 999px; overflow: hidden; }
    .steps-block .bar > span { background: linear-gradient(90deg, #d4a368 0%, #b88142 100%);
      transition: width 300ms ease; height: 100%; display: block; border-radius: 999px; }
    .steps-block .sub { color: #8a6840; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 40px; text-align: right; }

    /* nutrient rings */
    .nutrients-block { padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #faf7f2 0%, #f4ede0 100%);
      border: 1px solid rgba(200, 149, 75, 0.18);
      margin-bottom: 14px; }
    .nutrients-title { color: #4a4a4a; font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; margin-bottom: 14px; font-weight: 700; text-align: center; }
    .nutrient-rings { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .nutrient-ring { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .nutrient-ring svg { width: 72px; height: 72px;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.08)); }
    .nutrient-ring .track { fill: none; stroke: rgba(0,0,0,0.06); stroke-width: 7; }
    .nutrient-ring .prog { fill: none; stroke-width: 7; stroke-linecap: round;
      transition: stroke-dashoffset 300ms ease; }
    .nutrient-ring[data-key="p"]  .prog { stroke: url(#grad-protein); }
    .nutrient-ring[data-key="fi"] .prog { stroke: url(#grad-fiber); }
    .nutrient-ring[data-key="fa"] .prog { stroke: url(#grad-fats); }
    .nutrient-ring[data-key="c"]  .prog { stroke: url(#grad-carbs); }
    .nutrient-ring[data-key="p"]  .label { color: #b85a4a; }
    .nutrient-ring[data-key="fi"] .label { color: #5a7a5a; }
    .nutrient-ring[data-key="fa"] .label { color: #b88142; }
    .nutrient-ring[data-key="c"]  .label { color: #4a6c8c; }
    .nutrient-ring .label { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .nutrient-ring .ring-wrap { position: relative; }
    .nutrient-ring .ring-center { position: absolute; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center; gap: 0; }
    .nutrient-ring .ring-center .num { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--fg); letter-spacing: -0.02em; }
    .nutrient-ring .ring-center .denom { font-size: 9px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }

    /* macros pills inside hero */
    .hero .macros-block { padding: 8px 0 4px; }
    .hero .macros-block .macros-title { color: var(--muted); font-size: 12px; margin-bottom: 6px; letter-spacing: 0.04em; text-transform: uppercase; }
    .hero .macros-block .pill-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .hero .macros-block .pill-row .name { width: 64px; font-size: 13px; color: var(--fg); }
    .hero .macros-block .pill-row .val { font-variant-numeric: tabular-nums; color: var(--fg); font-size: 13px; min-width: 80px; text-align: right; }

    /* snacks */
    .hero .snacks-block { padding: 8px 0 0; border-top: 1px solid var(--line); margin-top: 6px; }
    .hero .snacks-block .snacks-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .hero .snacks-block .snacks-head .label { flex: 1; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .hero .snacks-block .snacks-head button { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: white; font: inherit; cursor: pointer; }
    .hero .snack-form { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 0; align-items: center; }
    .hero .snack-form input[type="text"] { flex: 1 1 140px; min-width: 100px; padding: 6px 8px;
      border: 1px solid var(--line); border-radius: 8px; font: inherit; }
    .hero .snack-form .mac-input { display: flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
    .hero .snack-form .mac-input input { width: 44px; padding: 4px 6px; border: 1px solid var(--line);
      border-radius: 6px; font: inherit; font-variant-numeric: tabular-nums; }
    .hero .snack-form button { padding: 6px 10px; border-radius: 8px; border: 0; background: var(--fg); color: white; font: inherit; cursor: pointer; }
    .hero .snack-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 8px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
      font-size: 13px; margin: 4px 4px 0 0; }
    .hero .snack-chip .chip-mac { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
    .hero .snack-chip button { padding: 0 4px; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; }
    .hero .snack-chip button:hover { color: var(--fg); }

    /* routine row icons */
    section.ordered { box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    section.ordered .row { gap: 8px; }
    section.ordered .row .glyph { width: 20px; flex: 0 0 auto; color: var(--muted);
      font-size: 14px; text-align: center; }

    .row .macros { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .row .macros label { display: flex; align-items: center; gap: 2px; font-size: 12px; color: var(--muted); }
    .row .macros input { width: 56px; padding: 4px 6px; border: 1px solid var(--line);
      border-radius: 6px; font: inherit; font-variant-numeric: tabular-nums; }

    /* focus rings */
    .hero input:focus, .hero button:focus,
    .row textarea:focus, .row .macros input:focus,
    .settings input:focus, .settings button:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(138,166,138,.25);
    }

    .save-bar { box-shadow: 0 -1px 2px rgba(0,0,0,.04); }
    .save-bar button { transition: transform 100ms ease; }
    .save-bar button:active { transform: scale(.98); }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="fast-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a8c4a3"/>
        <stop offset="100%" stop-color="#5a7d5a"/>
      </linearGradient>
      <linearGradient id="grad-protein" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e89887"/>
        <stop offset="100%" stop-color="#b85a4a"/>
      </linearGradient>
      <linearGradient id="grad-fiber" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a8c4a3"/>
        <stop offset="100%" stop-color="#5a7d5a"/>
      </linearGradient>
      <linearGradient id="grad-fats" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#e8b878"/>
        <stop offset="100%" stop-color="#b88142"/>
      </linearGradient>
      <linearGradient id="grad-carbs" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#88a8c8"/>
        <stop offset="100%" stop-color="#4a6c8c"/>
      </linearGradient>
    </defs>
  </svg>
  <main>
    <header>
      <h1 id="title">Daily Wellness</h1>
      <div class="stat" id="stat"></div>
    </header>
    <section id="app"></section>
  </main>
  <nav class="save-bar">
    <div>
