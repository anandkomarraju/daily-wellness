<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restore</title></head>
<body>
<h2>Restoring your routine...</h2>
<p id="msg">Writing items to localStorage...</p>
<script>
try {
  const items = {"items":[
    {"id":"b12_morning","label":"Morning B12 Sublingual","order":10},
    {"id":"morning_walk_30","label":"Morning Walk: 30 mins (Fasted)","order":20},
    {"id":"breakfast","label":"Breakfast with Protein","order":30,"macros":true},
    {"id":"walk_after_breakfast","label":"Post-Meal Walk: 10–15 mins","order":40},
    {"id":"recovery_routine","label":"Recovery Routine","order":50},
    {"id":"lunch","label":"Lunch - Fats and Fiber","order":60,"macros":true},
    {"id":"d_k2_fishoil","label":"Supplements (Fats Soluble: Vitamin D, K2 MK7, Fish Oil)","order":70},
    {"id":"strength_training","label":"Strength Training","order":80},
    {"id":"dinner","label":"Dinner before 8 pm","order":90,"macros":true},
    {"id":"collagen_coffee","label":"1 scoop Collagen","order":100},
    {"id":"magnesium_eve","label":"Evening Magnesium Glycinate","order":110}
  ]};
  localStorage.setItem("wellness:items", JSON.stringify(items));
  document.getElementById("msg").textContent = "Done! 11 items restored. Redirecting...";
  setTimeout(() => { window.location.href = "./"; }, 1500);
} catch(e) {
  document.getElementById("msg").textContent = "Error: " + e.message;
}
</script>
</body></html>
